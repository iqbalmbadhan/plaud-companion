# ==============================================================================
# CloudPanel Nginx vHost Configuration for PLAUD Companion (Laravel 12)
# Target: Ubuntu 24.04 / 24.6 | PHP 8.3 / 8.4 | MySQL / MariaDB
# Place in CloudPanel: Sites -> <your-site> -> Vhost
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    {{ssl_certificate_key}}
    {{ssl_certificate}}

    server_name {{domain_name}};
    root /home/{{site_user}}/htdocs/{{domain_name}}/backend-laravel/public;

    {{nginx_access_log}}
    {{nginx_error_log}}

    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    index index.php index.html;
    charset utf-8;

    # Allow signed update zip uploads (up to 150MB package + multipart overhead)
    client_max_body_size 200M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block dotfiles (.env, .git, .htaccess) except ACME challenge
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to sensitive files if ever exposed
    location ~* \.(env|key|pem|sql|bak|log|lock)$ {
        deny all;
    }

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM (CloudPanel replaces {{php_fpm_port}} with the site's PHP 8.3/8.4 FPM port)
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:{{php_fpm_port}};
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
