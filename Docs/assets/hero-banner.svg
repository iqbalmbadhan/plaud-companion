<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" role="img" aria-label="PLAUD Companion Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B33"/>
      <stop offset="60%" stop-color="#172541"/>
      <stop offset="100%" stop-color="#0F2A38"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18A879"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#18A879" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#18A879" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Brand Mark -->
  <rect x="64" y="64" width="60" height="60" rx="16" fill="url(#accentGrad)"/>
  <text x="94" y="106" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">P</text>

  <!-- Title & Subtitle -->
  <text x="142" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">PLAUD Companion</text>
  <text x="142" y="122" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#A9B8CA">Cross-Platform Transcript Management &amp; AI Productivity Workspace</text>

  <!-- Description -->
  <text x="64" y="176" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#D7E2EE">Import TXT, DOCX, PDF &amp; SRT transcripts · Connect AI in 1 click · Export formatted DOCX &amp; PDF ZIPs</text>

  <!-- Feature Pills -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="64" y="212" width="176" height="36" rx="18" fill="#18A879" fill-opacity="0.18" stroke="#18A879" stroke-opacity="0.6"/>
    <text x="152" y="235" text-anchor="middle" fill="#6EE7B7">Flutter Android &amp; iOS</text>

    <rect x="254" y="212" width="166" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="337" y="235" text-anchor="middle" fill="#E2E8F0">Next.js 14 Web Admin</text>

    <rect x="434" y="212" width="168" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="518" y="235" text-anchor="middle" fill="#E2E8F0">FastAPI + pgvector</text>

    <rect x="616" y="212" width="184" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="708" y="235" text-anchor="middle" fill="#E2E8F0">1-Click AI Connectors</text>
  </g>

  <!-- Right-side Audio Waveform Graphic -->
  <g transform="translate(910, 88)">
    <rect x="0" y="0" width="226" height="144" rx="18" fill="#101B33" fill-opacity="0.7" stroke="#2B4162"/>
    <text x="20" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" letter-spacing="1.2">PLAUD SDK v1.0 · AI READY</text>
    <g fill="url(#accentGrad)">
      <rect x="24" y="76" width="8" height="24" rx="4"/>
      <rect x="40" y="60" width="8" height="56" rx="4"/>
      <rect x="56" y="48" width="8" height="80" rx="4"/>
      <rect x="72" y="66" width="8" height="44" rx="4"/>
      <rect x="88" y="44" width="8" height="88" rx="4"/>
      <rect x="104" y="58" width="8" height="60" rx="4"/>
      <rect x="120" y="72" width="8" height="32" rx="4"/>
      <rect x="136" y="52" width="8" height="72" rx="4"/>
      <rect x="152" y="64" width="8" height="48" rx="4"/>
      <rect x="168" y="46" width="8" height="84" rx="4"/>
      <rect x="184" y="68" width="8" height="40" rx="4"/>
      <rect x="200" y="78" width="8" height="20" rx="4"/>
    </g>
  </g>
</svg>
