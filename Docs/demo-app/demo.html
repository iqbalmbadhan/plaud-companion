<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The demo never contacts any server: every network request is blocked by this policy. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#101B33">
<title>PLAUD Companion — Interactive Demo</title>
<style>
/* ===================================================================== */
/* Design tokens: two shipped designs, switched with <html data-theme>   */
/* ===================================================================== */
:root, [data-theme="classic"] {
  --bg:#F6F8FB; --surface:#FFFFFF; --surface-2:#EDF2F8; --text:#101B33; --text-2:#2D3F57; --muted:#64748B;
  --line:#DCE3EE; --accent:#18A879; --accent-2:#11855E; --accent-soft:#E8F8F2; --accent-text:#FFFFFF;
  --nav-bg:#101B33; --nav-text:#CBD5E1; --nav-active-bg:rgba(24,168,121,.16); --nav-active-text:#FFFFFF;
  --blue:#2563EB; --blue-soft:#EAF1FF; --amber:#B45309; --amber-soft:#FFF7ED; --danger:#DC2626; --danger-soft:#FEF2F2;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(16,27,51,.06),0 4px 14px rgba(16,27,51,.05);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif; --sidebar-w:240px; --banner-bg:#101B33; --banner-text:#E2E8F0;
}
[data-theme="modern"] {
  --bg:#0B1020; --surface:#121A2E; --surface-2:#1A2440; --text:#E6ECF5; --text-2:#C3CEE0; --muted:#94A3B8;
  --line:#26324F; --accent:#2DD4BF; --accent-2:#14B8A6; --accent-soft:rgba(45,212,191,.12); --accent-text:#04201C;
  --nav-bg:#0E1528; --nav-text:#94A3B8; --nav-active-bg:linear-gradient(135deg,rgba(45,212,191,.22),rgba(129,140,248,.22)); --nav-active-text:#FFFFFF;
  --blue:#818CF8; --blue-soft:rgba(129,140,248,.14); --amber:#FBBF24; --amber-soft:rgba(251,191,36,.12); --danger:#F87171; --danger-soft:rgba(248,113,113,.12);
  --radius:18px; --radius-sm:12px; --shadow:0 0 0 1px rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.35);
  --font:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; --sidebar-w:92px; --banner-bg:linear-gradient(90deg,#134E4A,#312E81); --banner-text:#E0F2F1;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.5; }
a { color:var(--accent); }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---- banners ---- */
.demo-banner { background:var(--banner-bg); color:var(--banner-text); font-size:12.5px; padding:7px 14px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:center; text-align:center; }
.demo-banner strong { letter-spacing:.06em; }
.demo-banner button { background:transparent; border:1px solid rgba(255,255,255,.35); color:inherit; border-radius:999px; padding:2px 10px; cursor:pointer; font-size:12px; }
.imp-bar { background:var(--amber-soft); color:var(--amber); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; font-weight:600; font-size:13px; }
.imp-bar .btn { padding:4px 12px; }

/* ---- shell ---- */
.app { display:flex; min-height:calc(100vh - 34px); }
.sidebar { width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--nav-bg); color:var(--nav-text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20; }
.brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; color:#fff; font-weight:700; font-size:15px; }
.brand-mark { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,var(--accent),#38BDF8); display:grid; place-items:center; color:#fff; font-weight:800; flex:0 0 32px; }
.nav { display:flex; flex-direction:column; gap:2px; padding:6px 10px; }
.nav button { all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm); color:var(--nav-text); font-size:13.5px; }
.nav button:hover { background:rgba(255,255,255,.06); color:#fff; }
.nav button.active { background:var(--nav-active-bg); color:var(--nav-active-text); font-weight:600; }
.nav .ico { width:20px; text-align:center; font-size:15px; }
.nav-sep { height:1px; background:rgba(255,255,255,.08); margin:8px 12px; }
.nav-note { margin-top:auto; padding:14px 18px; font-size:11.5px; color:var(--nav-text); opacity:.8; }
[data-theme="modern"] .brand { flex-direction:column; padding:16px 6px 10px; font-size:11px; text-align:center; }
[data-theme="modern"] .brand-text { display:none; }
[data-theme="modern"] .nav { padding:6px 8px; gap:4px; }
[data-theme="modern"] .nav button { flex-direction:column; gap:3px; padding:10px 4px; font-size:10.5px; text-align:center; justify-content:center; }
[data-theme="modern"] .nav .ico { font-size:18px; width:auto; }
[data-theme="modern"] .nav-note { display:none; }
.main-col { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; gap:12px; padding:12px 22px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:15; }
[data-theme="modern"] .topbar { background:rgba(18,26,46,.85); backdrop-filter:blur(10px); }
.topbar h1 { font-size:17px; margin:0; font-weight:700; }
.topbar .spacer { flex:1; }
.ws-select { max-width:260px; }
.user-chip { display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 4px; cursor:pointer; }
.avatar { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--blue)); flex:0 0 30px; }
.avatar.lg { width:56px; height:56px; font-size:20px; flex-basis:56px; }
main#view { padding:22px; flex:1; max-width:1280px; width:100%; }
.footer { padding:18px 22px 90px; text-align:center; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
.footer a { text-decoration:none; font-weight:600; }
.bottom-nav { display:none; }

/* ---- components ---- */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
.card h2, .card h3 { margin:0 0 10px; }
.card h2 { font-size:16px; } .card h3 { font-size:14.5px; }
.grid { display:grid; gap:16px; }
.g2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
.g-detail { grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); }
.stack { display:flex; flex-direction:column; gap:16px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.between { justify-content:space-between; }
.muted { color:var(--muted); } .small { font-size:12.5px; } .tiny { font-size:11.5px; }
.stat .num { font-size:26px; font-weight:800; letter-spacing:-.02em; }
.stat .lbl { color:var(--muted); font-size:12.5px; }
.btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:8px 14px; border-radius:var(--radius-sm); cursor:pointer; font-weight:600; font-size:13px; text-decoration:none; white-space:nowrap; }
.btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
[data-theme="modern"] .btn.primary { background:linear-gradient(135deg,var(--accent),#818CF8); border:0; }
.btn.primary:hover { filter:brightness(1.05); }
.btn.danger { color:var(--danger); border-color:var(--danger); background:transparent; }
.btn.ghost { background:transparent; }
.btn.sm { padding:5px 10px; font-size:12px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity:.45; cursor:not-allowed; }
input[type=text], input[type=email], input[type=search], select, textarea { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px; width:100%; }
[data-theme="modern"] input[type=text], [data-theme="modern"] input[type=email], [data-theme="modern"] input[type=search], [data-theme="modern"] select, [data-theme="modern"] textarea { background:var(--surface-2); }
textarea { min-height:120px; resize:vertical; }
label.fld { display:flex; flex-direction:column; gap:4px; font-size:12.5px; font-weight:600; color:var(--text-2); }
.tag { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--line); }
.tag.green { background:var(--accent-soft); color:var(--accent-2); border-color:transparent; }
[data-theme="modern"] .tag.green { color:var(--accent); }
.tag.blue { background:var(--blue-soft); color:var(--blue); border-color:transparent; }
.tag.amber { background:var(--amber-soft); color:var(--amber); border-color:transparent; }
.tag.red { background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.notice { border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; background:var(--blue-soft); color:var(--text-2); border:1px solid var(--line); }
.notice.amber { background:var(--amber-soft); } .notice.red { background:var(--danger-soft); } .notice.green { background:var(--accent-soft); }
table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); }
.tbl td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:0; }
.table-wrap { overflow-x:auto; }
.list-item { display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); }
.list-item:last-child { border-bottom:0; }
.list-item .grow { flex:1; min-width:0; }
.list-item .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.clickable { cursor:pointer; } .clickable:hover .title { color:var(--accent); }
.icon-box { width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent-2); display:grid; place-items:center; font-size:11px; font-weight:800; flex:0 0 38px; }
[data-theme="modern"] .icon-box { color:var(--accent); }
.seg { display:flex; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); }
.seg:last-child { border-bottom:0; }
.seg .who { flex:0 0 130px; }
.seg .spk { font-weight:700; font-size:12.5px; }
.seg .time { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.seg p { margin:0; flex:1; }
.spk-0 { color:#0F766E; } .spk-1 { color:#1D4ED8; } .spk-2 { color:#9333EA; } .spk-3 { color:#B45309; } .spk-4 { color:#BE123C; }
[data-theme="modern"] .spk-0 { color:#2DD4BF; } [data-theme="modern"] .spk-1 { color:#93C5FD; } [data-theme="modern"] .spk-2 { color:#C4B5FD; } [data-theme="modern"] .spk-3 { color:#FCD34D; } [data-theme="modern"] .spk-4 { color:#FDA4AF; }
.engine-note { font-size:11.5px; color:var(--muted); margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; }
.chat { display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto; padding:4px; }
.msg { padding:10px 12px; border-radius:var(--radius-sm); max-width:92%; white-space:pre-wrap; }
.msg.user { align-self:flex-end; background:var(--accent); color:var(--accent-text); }
.msg.ai { align-self:flex-start; background:var(--surface-2); }
.msg.err { align-self:flex-start; background:var(--danger-soft); color:var(--danger); }
.dropzone { border:2px dashed var(--line); border-radius:var(--radius); padding:28px; text-align:center; background:var(--surface-2); cursor:pointer; }
.dropzone.over { border-color:var(--accent); background:var(--accent-soft); }
.tabs { display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:16px; }
.tabs button { all:unset; cursor:pointer; padding:9px 14px; font-weight:600; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; }
.tabs button.active { color:var(--text); border-bottom-color:var(--accent); }
.steps { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
.steps li { display:flex; gap:8px; align-items:center; font-size:13px; }
.dot { width:10px; height:10px; border-radius:50%; background:var(--line); flex:0 0 10px; }
.dot.ok { background:var(--accent); } .dot.run { background:var(--amber); } .dot.fail { background:var(--danger); }
.progress { height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.progress > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
.check-row { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); }
.check-row:last-child { border-bottom:0; }
.check-row.done .txt { text-decoration:line-through; color:var(--muted); }
.theme-card { border:2px solid var(--line); border-radius:var(--radius); padding:12px; cursor:pointer; background:var(--surface); }
.theme-card.active { border-color:var(--accent); }
.theme-prev { height:70px; border-radius:10px; display:flex; overflow:hidden; margin-bottom:8px; }
.empty { text-align:center; color:var(--muted); padding:28px 10px; }
.kv { display:grid; grid-template-columns:140px 1fr; gap:6px 12px; font-size:13px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; }
pre.code { background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px; overflow-x:auto; font-size:12px; white-space:pre-wrap; word-break:break-word; margin:6px 0 0; }

/* ---- login (persona picker) ---- */
.login-wrap { max-width:980px; margin:0 auto; padding:36px 18px; }
.login-head { text-align:center; margin-bottom:22px; }
.login-head h1 { margin:10px 0 6px; font-size:26px; }
.persona { display:flex; flex-direction:column; gap:10px; text-align:left; cursor:pointer; transition:transform .12s, border-color .12s; }
.persona:hover { transform:translateY(-2px); border-color:var(--accent); }
.persona[aria-disabled="true"] { opacity:.5; cursor:not-allowed; transform:none; }

/* ---- modal & toast ---- */
.modal-back { position:fixed; inset:0; background:rgba(2,6,23,.55); display:grid; place-items:center; z-index:100; padding:16px; }
.modal { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); width:min(560px,100%); max-height:90vh; overflow-y:auto; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.35); }
.modal h2 { margin:0 0 12px; font-size:17px; }
.toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:200; }
.toast { background:var(--text); color:var(--bg); padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow); max-width:360px; }
.toast.err { background:var(--danger); color:#fff; }

/* ---- responsive (phones: Apple & Android) ---- */
@media (max-width: 980px) {
  .g4 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g3, .g-detail { grid-template-columns:1fr; }
}
@media (max-width: 760px) {
  .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); transition:transform .2s; width:250px; }
  [data-theme="modern"] .sidebar { width:250px; }
  [data-theme="modern"] .nav button { flex-direction:row; font-size:13.5px; padding:10px 12px; justify-content:flex-start; }
  body.nav-open .sidebar { transform:none; box-shadow:0 0 40px rgba(0,0,0,.4); }
  .g2, .g4 { grid-template-columns:1fr; }
  main#view { padding:14px; }
  .topbar { padding:10px 12px; gap:8px; }
  .topbar h1 { font-size:15px; }
  .ws-select { max-width:150px; }
  .user-chip .nm { display:none; }
  .seg { flex-direction:column; gap:2px; } .seg .who { flex-basis:auto; display:flex; gap:8px; }
  .bottom-nav { display:flex; position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav button { all:unset; flex:1; text-align:center; font-size:10.5px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .bottom-nav button .ico { font-size:18px; }
  .bottom-nav button.active { color:var(--accent); font-weight:700; }
  .kv { grid-template-columns:1fr; }
  .hide-sm { display:none; }
}
@media (min-width: 761px) { .show-sm { display:none !important; } }
@media print { .sidebar, .topbar, .demo-banner, .bottom-nav, .footer { display:none; } }
</style>

<script id="demo-core">
(function (root) {
'use strict';
var PD = {};
PD.STATE_VERSION = 3;
PD.APP_VERSION = '2026.11.15.0449';

/* ---------- text helpers ---------- */
PD.esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

};
PD.xmlEsc = function (s) {
  return PD.esc(String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, ''));
};
PD.fmtMs = function (ms) {
  ms = Math.max(0, Math.round(Number(ms) || 0));
  var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  var mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
};
PD.fmtDuration = function (ms) {
  var min = Math.round((Number(ms) || 0) / 60000);
  if (min < 60) return min + ' min';
  return Math.floor(min / 60) + ' h ' + (min % 60) + ' min';
};
PD.slug = function (title) {
  var s = String(title || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
  return (s || 'transcript').slice(0, 80);
};
PD.hash = function (str) { // FNV-1a, used only for duplicate detection
  var h = 0x811c9dc5;

  return ('00000000' + h.toString(16)).slice(-8);
};
PD.initials = function (name) {
  var p = String(name || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
};

/* ---------- permissions ---------- */
PD.ROLES = ['owner', 'admin', 'editor', 'viewer'];
PD.ROLE_LABEL = { owner: 'Owner', admin: 'Admin', editor: 'Editor', viewer: 'Viewer' };
PD.PERMS = {
  'transcript.view':   ['owner', 'admin', 'editor', 'viewer'],
  'transcript.create': ['owner', 'admin', 'editor'],
  'transcript.delete': ['owner', 'admin', 'editor'],
  'project.create':    ['owner', 'admin', 'editor'],
  'ai.run':            ['owner', 'admin', 'editor'],
  'ai.connect':        ['owner', 'admin'],
  'export.create':     ['owner', 'admin', 'editor'],
  'device.manage':     ['owner', 'admin', 'editor'],
  'team.invite':       ['owner', 'admin'],
  'team.manage':       ['owner', 'admin']

PD.can = function (role, perm) { return !!role && (PD.PERMS[perm] || []).indexOf(role) !== -1; };

PD.MAX_SEGMENTS = 3000;
PD.parseClock = function (str) {
  var m = String(str).trim().match(/^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?$/);
  if (!m) return null;

  if (m[4]) ms += Number((m[4] + '00').slice(0, 3));

};
function estimateMs(text) { return Math.max(2000, Math.round(String(text).split(/\s+/).length / 2.6 * 1000)); }
function finishTimes(segs) {
  for (var i = 0; i < segs.length; i++) {

/* ---------- import ---------- */
function addTranscript(title, segs, source, projectId) {
  if (!segs.length) throw new Error('No readable text found.');
  var text = PD.segmentsToText(segs), h = PD.hash(text);
  var dup = wsTranscripts().find(function (t) { return t.hash === h; });
  if (dup) return { duplicate: dup };
  var last = segs[segs.length - 1];
  var t = { id: uid('t'), ws: S.session.ws, project: projectId || null, title: String(title || 'Untitled transcript').slice(0, 160), source: source, recordedAt: new Date().toISOString(), createdAt: new Date().toISOString(), createdBy: me().id, segments: segs, durationMs: last.end || last.start, status: 'ready', hash: h };
  S.transcripts.push(t);
  audit('transcript.import', t.title + ' (' + source + ', ' + segs.length + ' segments)');
  if (!save()) { S.transcripts.pop(); throw new Error('Browser storage is full.'); }
  return { transcript: t };
}
async function importFiles(files) {
  if (!can('transcript.create')) return denied('import');
  var out = document.getElementById('imp-results'), proj = (document.getElementById('imp-proj') || {}).value || null, html = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i], ext = (f.name.split('.').pop() || '').toLowerCase(), name = f.name.replace(/\.[^.]+$/, '');
    try {
      if (['txt', 'srt', 'vtt', 'json', 'docx'].indexOf(ext) === -1) throw new Error('Unsupported file type .' + ext + '.');
      if (f.size === 0 || f.size > 2 * 1024 * 1024) throw new Error('File must be between 1 byte and 2 MB in the demo.');
      var segs, title = name, src;
      if (ext === 'docx') {
        var entries = await PD.readZip(new Uint8Array(await f.arrayBuffer()));
        if (!entries['word/document.xml']) throw new Error('This DOCX has no document body.');
        var xml = new TextDecoder().decode(await PD.zipEntryBytes(entries['word/document.xml'], 10e6));
        segs = PD.parseText(PD.docxXmlToText(xml)); src = 'DOCX import';
      } else {
        var text = await f.text();
        if (ext === 'json') { var j = PD.parseJson(text); segs = j.segments; title = j.title || name; src = 'PLAUD JSON'; }
        else if (ext === 'srt' || ext === 'vtt') { segs = PD.parseSrt(text); src = ext.toUpperCase() + ' import'; }
        else { segs = PD.parseText(text); src = 'TXT import'; }
      }
      var r = addTranscript(title, segs, src, proj);
      html.push(r.duplicate ? '<div class="notice amber">' + esc(f.name) + ': already imported as "' + esc(r.duplicate.title) + '".</div>'
        : '<div class="notice green">' + esc(f.name) + ': imported ' + r.transcript.segments.length + ' segments. <a href="#/t/' + esc(r.transcript.id) + '">Open</a></div>');
    } catch (e) {
      var err = logError('import', f.name + ': ' + e.message, { file_type: ext, size_bytes: f.size });
      html.push('<div class="notice red">' + esc(f.name) + ': ' + esc(e.message) + ' <span class="tiny">(ref ' + esc(err.id) + ')</span></div>');
    }
  }
  if (out) out.innerHTML = html.join('<div style="height:6px"></div>');
}

    try {
      var r = addTranscript(fd.get('title').trim(), PD.parseText(fd.get('text')), 'Paste', (document.getElementById('imp-proj') || {}).value || null);
      if (r.duplicate) toast('This transcript already exists: ' + r.duplicate.title, true); else { toast('Transcript saved.'); go('t', r.transcript.id); }
    } catch (err) { toast(err.message, true); }
  } else if (kind === 'project') {
    if (!can('project.create')) return denied('create projects');
    var p = { id: uid('p'), ws: S.session.ws, name: fd.get('name').trim(), description: (fd.get('desc') || '').trim() };
    S.projects.push(p); audit('project.created', p.name); save(); render(); toast('Project created.');
  } else if (kind === 'ask-one') {
    var t = transcript(f.getAttribute('data-id')); if (t) ask(t.id, fd.get('q').trim(), [t]);
  } else if (kind === 'ask-many') {
    var ts = wsTranscripts().filter(function (x) { return ui.selected[x.id]; });
    if (!ts.length) { toast('Select at least one transcript first.', true); return; }
    ask('ws:' + S.session.ws, fd.get('q').trim(), ts);
  } else if (kind === 'export') {
    if (!can('export.create')) return denied('create exports');
    var ids = fd.getAll('t'), chosen = wsTranscripts().filter(function (x) { return ids.indexOf(x.id) !== -1; });
    if (!chosen.length) { toast('Select at least one transcript.', true); return; }
    var opts = { format: fd.get('format'), template: fd.get('template'), org: fd.get('org').trim(), summary: !!fd.get('summary') || fd.get('template') !== 'clean_transcript', actions: !!fd.get('actions') || fd.get('template') === 'meeting_minutes' };
    try {
      var res = PD.buildExport(chosen, opts), name = 'plaud-export-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.zip';
      download(res.bytes, name, 'application/zip');
      S.exports.unshift({ id: uid('e'), ws: S.session.ws, name: name, count: chosen.length, format: opts.format, at: Date.now(), by: realActor().id, as: impersonating() ? me().id : null });
      audit('export.created', chosen.length + ' transcripts, ' + opts.format); save(); render(); toast('Export package downloaded.');
    } catch (err) { var x = logError('export', err.message); toast('Export failed. Reference ' + x.id, true); }
  } else if (kind === 'invite') {
    if (!can('team.invite')) return denied('invite');
    S.invites.unshift({ ws: S.session.ws, email: fd.get('email').trim().toLowerCase(), role: fd.get('role'), at: Date.now() });
    audit('team.invited', fd.get('email') + ' as ' + PD.ROLE_LABEL[fd.get('role')]); save(); render(); toast('Invitation created (demo: no email sent).');
  } else if (kind === 'profile') {
    var u = me(); u.name = fd.get('name').trim() || u.name; u.title = fd.get('title').trim();
    audit('profile.updated', u.name); save(); render(); toast('Profile saved.');
  } else if (kind === 'imp') {
    var reason = fd.get('reason').trim(); if (reason.length < 5) { toast('Please give a short reason (at least 5 characters).', true); return; }
    closeModal(); startImpersonation(f.getAttribute('data-id'), reason);
  } else if (kind === 'key') {
    var key = fd.get('key').trim(), pid = f.getAttribute('data-id');
    if (key.length < 12) { toast('That does not look like an API key.', true); return; }
    providerState().connected[pid] = { mode: 'key', last4: key.slice(-4), at: Date.now(), by: realActor().id };
    providerState().active = pid; audit('ai.provider_connected', providerNames()[pid] + ' (API key)'); save(); closeModal(); render();
    toast(providerNames()[pid] + ' connected (demo: the key was not stored).');
  } else if (kind === 'add-user') {
    var nu = { id: uid('u'), name: fd.get('name').trim(), email: fd.get('email').trim().toLowerCase(), title: fd.get('title').trim() || 'Team member', developer: false, status: 'active', joined: new Date().toISOString() };
    S.users.push(nu);
    if (fd.get('ws')) S.members.push({ ws: fd.get('ws'), user: nu.id, role: fd.get('role'), status: 'active' });
    audit('user.created', nu.name + ' <' + nu.email + '>'); save(); closeModal(); render(); toast('User added.');
  }
});

function handle(act, id, el) {
  var t;
  switch (act) {
    case 'login': {
      var u = user(id); if (!u || u.status !== 'active') { toast('This account is suspended. Contact your administrator.', true); return; }
      S.session = { userId: u.id, impersonatorId: null, ws: null }; S.audit.unshift({ id: uid('a'), at: Date.now(), actor: u.id, as: null, ws: null, action: 'auth.login', detail: 'Demo sign-in (no password)' });
      save(); go(u.developer ? 'dev' : 'dashboard'); render(); return;
    }
    case 'logout': if (impersonating()) { endImpersonation(); return; } audit('auth.logout', ''); S.session = null; save(); location.hash = ''; render(); return;
    case 'reset-demo': modal('<h2>Reset the demo?</h2><p class="small muted">This deletes everything you changed in this browser and restores the sample data.</p><div class="row"><button class="btn danger" data-act="reset-confirm">Reset</button><button class="btn" data-act="close">Cancel</button></div>'); return;
    case 'reset-confirm': { var th = S.theme; S = PD.seed(); S.theme = th; save(); closeModal(); location.hash = ''; render(); toast('Demo reset.'); return; }
    case 'close': closeModal(); return;
    case 'toggle-theme': S.theme = S.theme === 'modern' ? 'classic' : 'modern'; save(); render(); return;
    case 'set-theme': S.theme = el.getAttribute('data-theme-id') === 'modern' ? 'modern' : 'classic'; save(); render(); return;
    case 'open-nav': document.body.classList.toggle('nav-open'); return;
    case 'end-imp': endImpersonation(); return;
    case 'summarize': t = transcript(id); if (t) summarize(t); return;
    case 'extract': t = transcript(id); if (t) extract(t); return;
    case 'toggle-action': {
      if (!can('ai.run')) { el.checked = !el.checked; return denied('update action items'); }
      t = transcript(parseRoute().arg); var it = t && (t.actions || []).find(function (x) { return x.id === id; });
      if (it) { it.done = !it.done; audit('action_item.' + (it.done ? 'done' : 'reopened'), it.task.slice(0, 80)); save(); render(); } return;
    }
    case 'export-one': {
      t = transcript(id); if (!t) return; if (!can('export.create')) return denied('export');
      var ai = {};
      if (t.summary) ai.summary = t.summary;
      if (t.actions) ai.actions = { items: t.actions, engine: t.actionsEngine || PD.ENGINE_LABEL };
      download(PD.buildDocx(t, { org: activeWs().ws.name }, ai), PD.slug(t.title) + '.docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      audit('export.docx', t.title); save(); toast('Word document downloaded.'); return;
    }
    case 'delete-t':
      modal('<h2>Delete this transcript?</h2><p class="small muted">"' + esc(transcript(id).title) + '" and its summary will be removed.</p><div class="row"><button class="btn danger" data-act="delete-confirm" data-id="' + esc(id) + '">Delete</button><button class="btn" data-act="close">Cancel</button></div>'); return;
    case 'delete-confirm': {
      if (!can('transcript.delete')) return denied('delete');
      t = transcript(id); if (!t) return;
      S.transcripts = S.transcripts.filter(function (x) { return x.id !== id; }); delete S.chat[id];
      audit('transcript.deleted', t.title); save(); closeModal(); go('transcripts'); toast('Transcript deleted.'); return;
    }
    case 'open-project': ui.tFilter = { q: '', project: id }; go('transcripts'); return;
    case 'sel-t': ui.selected[id] = el.checked; return;
    case 'sel-all': { var all = wsTranscripts().every(function (x) { return ui.selected[x.id]; }); wsTranscripts().forEach(function (x) { ui.selected[x.id] = !all; }); render(); return; }
    case 'connect':
      if (!can('ai.connect')) return denied('connect providers');
      if (id === 'openrouter') {
        modal('<h2>Sign in with OpenRouter</h2><p class="small">In the full app this opens OpenRouter\'s sign-in page. You approve access, OpenRouter sends back a key that belongs to you, and the server stores it encrypted. The key never reaches your phone or browser.</p><ol class="small"><li>Click Continue → OpenRouter sign-in opens</li><li>Approve "PLAUD Companion"</li><li>You return here, connected</li></ol><div class="notice amber">Demo: nothing is opened; the connection is simulated.</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="oauth-done">Continue (simulated)</button><button class="btn" data-act="close">Cancel</button></div>');
      } else {
        modal('<h2>Connect ' + providerNames()[id] + '</h2><form class="stack" data-form="key" data-id="' + id + '"><label class="fld">API key<input type="text" name="key" autocomplete="off" required placeholder="Paste your key"></label><div class="notice amber">Demo: do not paste a real key. Nothing is sent or stored; only the last 4 characters are kept to show the connection.</div><div class="row"><button class="btn primary">Connect</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>');
      } return;
    case 'oauth-done': providerState().connected.openrouter = { mode: 'oauth', at: Date.now(), by: realActor().id }; providerState().active = 'openrouter'; audit('ai.provider_connected', 'OpenRouter (sign-in)'); save(); closeModal(); render(); toast('OpenRouter connected (simulated).'); return;
    case 'connect-managed': providerState().connected.openrouter = { mode: 'managed', at: Date.now(), by: realActor().id }; providerState().active = 'openrouter'; audit('ai.managed_key', activeWs().ws.name); save(); render(); toast('Managed OpenRouter key set up (simulated).'); return;
    case 'use-provider': providerState().active = id; audit('ai.provider_selected', providerNames()[id]); save(); render(); return;
    case 'disconnect': delete providerState().connected[id]; if (providerState().active === id) providerState().active = 'demo'; audit('ai.provider_disconnected', providerNames()[id]); save(); render(); toast('Disconnected.'); return;
    case 'pair': {
      if (!can('device.manage')) return denied('manage devices');
      var bar = document.getElementById('pair-bar'), w = 0; el.disabled = true;
      var iv = setInterval(function () { w += 20; if (bar) bar.style.width = w + '%'; if (w >= 100) { clearInterval(iv); S.device = { paired: true, name: 'PLAUD Note · Demo', battery: 86, firmware: '1.4.2', nextSample: S.device.nextSample || 0 }; audit('device.paired', 'PLAUD Note (simulated)'); save(); render(); toast('Device paired (simulated).'); } }, 250);
      return;
    }
    case 'unpair': S.device.paired = false; audit('device.unpaired', ''); save(); render(); return;
    case 'sync': {
      if (!can('device.manage')) return denied('sync devices');
      var sample = PD.SAMPLE_RECORDINGS[S.device.nextSample];
      if (!sample) { toast('All recordings on the device are already synced.'); return; }
      var sb = document.getElementById('sync-bar'), p2 = 0; el.disabled = true;
      var iv2 = setInterval(function () {
        p2 += 25; if (sb) sb.style.width = p2 + '%';
        if (p2 >= 100) {
          clearInterval(iv2);
          var segs = JSON.parse(JSON.stringify(sample.segments)), pj = S.projects.find(function (x) { return x.id === sample.project && x.ws === S.session.ws; });
          var r = addTranscript(sample.title, segs, 'PLAUD Note', pj ? pj.id : null);
          S.device.nextSample++; S.device.battery = Math.max(5, S.device.battery - 3);
          if (r.transcript) { r.transcript.status = 'transcribing'; save(); render(); toast('Recording received. Transcribing… (simulated)'); setTimeout(function () { r.transcript.status = 'ready'; save(); render(); toast('"' + r.transcript.title + '" is ready.'); }, 1800); }
          else { save(); render(); toast('Already synced.'); }
        }
      }, 250);
      return;
    }
    case 'remove-member': {
      if (!can('team.manage')) return denied('manage members');
      var uid2 = el.getAttribute('data-user'), nm = (user(uid2) || {}).name;
      S.members = S.members.filter(function (m) { return !(m.ws === S.session.ws && m.user === uid2 && m.role !== 'owner'); });
      audit('team.member_removed', nm); save(); render(); toast(nm + ' removed from the workspace.'); return;
    }
    case 'dev-tab': ui.devTab = id; render(); return;
    case 'impersonate': {
      var target = user(id);
      modal('<h2>Work as ' + esc(target.name) + '?</h2><p class="small">You will see and use the app exactly as ' + esc(target.name) + ', including their documents, for up to ' + IMPERSONATION_MIN + ' minutes. A banner stays on screen and every action is recorded in the audit log with your name.</p>' +
        '<form class="stack" data-form="imp" data-id="' + esc(id) + '"><label class="fld">Reason (saved in the audit log)<input type="text" name="reason" required maxlength="200" placeholder="e.g. Preparing board export on Morgan\'s request"></label><div class="notice small">Full app: you confirm with your password or 2FA code before the session starts.</div><div class="row"><button class="btn primary">Start session</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>');
      return;
    }
    case 'toggle-suspend': {
      var su = user(id); if (!su || su.id === me().id) return;
      if (su.developer && su.status === 'active' && S.users.filter(function (x) { return x.developer && x.status === 'active'; }).length <= 1) { toast('You cannot suspend the last active developer.', true); return; }
      su.status = su.status === 'active' ? 'suspended' : 'active';
      audit(su.status === 'active' ? 'user.reactivated' : 'user.suspended', su.name); save(); render(); toast(su.name + (su.status === 'active' ? ' reactivated.' : ' suspended. They are signed out everywhere.')); return;
    }
    case 'force-logout': audit('user.sessions_revoked', (user(id) || {}).name); save(); render(); toast('All sessions and tokens for ' + (user(id) || {}).name + ' were revoked (simulated).'); return;
    case 'send-reset': audit('user.password_reset_sent', (user(id) || {}).name); save(); render(); toast('Password reset email sent to ' + (user(id) || {}).email + ' (simulated).'); return;
    case 'add-user':
      modal('<h2>Add user</h2><form class="stack" data-form="add-user"><label class="fld">Name<input type="text" name="name" required maxlength="80"></label><label class="fld">Email<input type="email" name="email" required maxlength="120"></label><label class="fld">Job title<input type="text" name="title" maxlength="80"></label>' +
        '<div class="grid g2"><label class="fld">Workspace<select name="ws"><option value="">None</option>' + S.workspaces.map(function (w) { return '<option value="' + esc(w.id) + '">' + esc(w.name) + '</option>'; }).join('') + '</select></label><label class="fld">Role<select name="role"><option value="editor">Editor</option><option value="viewer">Viewer</option><option value="admin">Admin</option></select></label></div>' +
        '<div class="row"><button class="btn primary">Add user</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>');
      return;
    case 'managed-for': {
      if (!S.providers[id]) S.providers[id] = { active: 'demo', connected: {} };
      S.providers[id].connected.openrouter = { mode: 'managed', at: Date.now(), by: me().id }; S.providers[id].active = 'openrouter';
      audit('ai.managed_key', (S.workspaces.find(function (w) { return w.id === id; }) || {}).name + ' (spending cap $25/month)'); save(); render(); toast('Managed OpenRouter key set up (simulated).'); return;
    }
    case 'toggle-outage': S.debug.outage = !S.debug.outage; audit('debug.outage_' + (S.debug.outage ? 'on' : 'off'), ''); save(); render(); return;
    case 'clear-errors': S.errors = []; audit('debug.cleared', ''); save(); render(); return;
    case 'apply-update': {
      el.disabled = true; var states = [], i = 0, from = S.system.version, to = bumpVersion(from);
      var iv3 = setInterval(function () {
        states[i] = 'ok'; if (i + 1 < UPDATE_STEPS.length) states[i + 1] = 'run'; renderSteps(states); i++;
        if (i >= UPDATE_STEPS.length) {
          clearInterval(iv3);
          S.system.previous = from; S.system.version = to;
          S.system.history.unshift({ at: Date.now(), action: 'update', from: from, to: to, by: me().id, ok: true });
          audit('system.update_applied', from + ' → ' + to); save(); setTimeout(function () { render(); toast('Updated to ' + to + ' (simulated).'); }, 400);
        }
      }, 380);
      states[0] = 'run'; renderSteps(states); return;
    }
    case 'rollback': {
      if (!S.system.previous) return;
      var cur = S.system.version; S.system.version = S.system.previous; S.system.previous = null;
      S.system.history.unshift({ at: Date.now(), action: 'rollback', from: cur, to: S.system.version, by: me().id, ok: true });
      audit('system.rollback', cur + ' → ' + S.system.version); save(); render(); toast('Rolled back to ' + S.system.version + ' (simulated).'); return;
    }
    case 'backup': S.backups.unshift({ id: uid('b'), at: Date.now(), size: 4500000 + Math.round(JSON.stringify(S.transcripts).length * 3), encrypted: true, by: me().name }); audit('system.backup_created', 'manual'); save(); render(); toast('Encrypted backup created (simulated).'); return;
    case 'dl-backup': download(PD.utf8(JSON.stringify(S, null, 2)), 'plaud-demo-data.json', 'application/json'); audit('system.demo_data_downloaded', ''); save(); return;
  }
}

/* ---------- boot ---------- */
S = load();
// Shareable links: ?as=<user id>&theme=modern opens the demo as that person (the demo has no passwords).
(function () {
  var qs = new URLSearchParams(location.search), as = qs.get('as'), th = qs.get('theme');
  if (th === 'modern' || th === 'classic') S.theme = th;
  var u = as ? user(as) : null;
  if (u && u.status === 'active' && (!S.session || S.session.userId !== u.id)) { S.session = { userId: u.id, impersonatorId: null, ws: null }; audit('auth.login', 'Demo link sign-in'); }
  if (as || th) { save(); history.replaceState(null, '', location.pathname + location.hash); }
})();
window.addEventListener('hashchange', function () { render(); var v = document.getElementById('view'); if (v) v.focus({ preventScroll: true }); window.scrollTo(0, 0); });
render();
timer = setInterval(tick, 1000);
})();
</script>
</body>
