name: PLAUD Companion CI (Laravel + Mobile)

on:
  push:
    branches: [main, master, develop, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel-tests:
    name: Laravel Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-laravel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sodium, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Feature tests (PHPUnit)
        run: vendor/bin/phpunit --testsuite Feature

      - name: Unit tests (project runner)
        run: php tests/run_tests.php

  mobile-tests:
    name: Mobile Tests & Analysis (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos || true

      - name: Run widget & unit tests
        run: flutter test --coverage || flutter test || true

  mobile-build-android:
    name: Build Android APK
    needs: [mobile-tests, laravel-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android Wrapper & Restore Config
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          rm -rf android
          flutter create --platforms=android --org com.plaudcompanion --project-name plaud_companion .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew || true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaud-companion-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  mobile-build-ios:
    name: Build iOS Runner
    needs: [mobile-tests, laravel-tests]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Xcode Project & Restore Info.plist
        run: |
          cp ios/Runner/Info.plist /tmp/Info.plist
          flutter create --platforms=ios --org com.plaudcompanion --project-name plaud_companion .
          cp /tmp/Info.plist ios/Runner/Info.plist

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build iOS App (No Codesign for CI)
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS App Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaud-companion-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mobile-build-android, mobile-build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package iOS build
        run: |
          if [ -d release-artifacts/plaud-companion-ios-build ]; then
            (cd release-artifacts && zip -qr plaud-companion-ios-unsigned.zip plaud-companion-ios-build)
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/plaud-companion-android-apk/*.apk
            release-artifacts/plaud-companion-ios-unsigned.zip
