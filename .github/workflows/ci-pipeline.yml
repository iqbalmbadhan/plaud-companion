name: PLAUD Companion Multi-Platform CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend API & Service Tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run automated test suite & workspace isolation
        run: |
          pytest -v --cov=app --cov-report=term-missing tests/

  web-admin:
    name: Web Admin Build (Next.js 14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Lint Next.js code
        run: npm run lint

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: "PLAUD Companion Admin"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_DEMO_MODE: "true"

      - name: Upload Web Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaud-companion-web-build
          path: web/.next
          include-hidden-files: true
          retention-days: 14

  mobile-tests:
    name: Mobile Tests & Analysis (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run widget & unit tests
        run: flutter test --coverage

  mobile-build-android:
    name: Build Android APK
    needs: [mobile-tests, backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android Wrapper & Restore Config
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          rm -f android/settings.gradle android/build.gradle android/app/build.gradle
          flutter create --platforms=android --org com.plaudcompanion --project-name plaud_companion .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaud-companion-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  mobile-build-ios:
    name: Build iOS Runner
    needs: [mobile-tests, backend-tests]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Xcode Project & Restore Info.plist
        run: |
          cp ios/Runner/Info.plist /tmp/Info.plist
          flutter create --platforms=ios --org com.plaudcompanion --project-name plaud_companion .
          cp /tmp/Info.plist ios/Runner/Info.plist

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build iOS App (No Codesign for CI)
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS App Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaud-companion-ios-build
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
          retention-days: 14
